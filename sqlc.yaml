version: "2"
sql:
  - engine: postgresql
    schema:
      - database/bootstrap/001-extensions.sql
      - database/sqlc/schema_migrations.sql
      - database/migrations
    queries: database/queries
    gen:
      go:
        package: sqlcdb
        out: internal/store/postgres/sqlcdb
        sql_package: pgx/v5
        emit_json_tags: false
        emit_interface: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: vector
            go_type:
              import: github.com/pgvector/pgvector-go
              package: pgvector
              type: Vector
          - db_type: vector
            nullable: true
            go_type:
              import: github.com/pgvector/pgvector-go
              type: Vector
              pointer: true
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
