{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "extended-memory.fullname" . }}
  labels:
    {{- include "extended-memory.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ required (printf "secret.data.%s is required when secret.create=true" $key) $value | quote }}
  {{- end }}
{{- end }}

