# Example only: not listed in kustomization.yaml. Keep this credential in a
# separate Secret: only the bootstrap init container mounts it.
apiVersion: v1
kind: Secret
metadata:
  name: memory-api-bootstrap
type: Opaque
stringData:
  MEMORY_BOOTSTRAP_DATABASE_URL: postgres://postgres:CHANGE_ME@postgres:5432/extend_memory_for_ai?sslmode=require
