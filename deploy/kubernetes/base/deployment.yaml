apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-api
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      # Longer than MEMORY_SHUTDOWN_TIMEOUT so in-flight requests finish.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Applies pending migrations before the API starts. Concurrent pods
        # are serialized by golang-migrate's advisory lock; with nothing to
        # apply it is a no-op. Only this container gets the migrator role.
        - name: migrate
          image: memory-api
          command: ["/usr/local/bin/memory-admin", "migrate", "up"]
          env:
            - name: MEMORY_MIGRATOR_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: memory-api, key: MEMORY_MIGRATOR_DATABASE_URL}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: memory-api
          image: memory-api
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: memory-api
          env:
            - name: MEMORY_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: memory-api, key: MEMORY_DATABASE_URL}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef: {name: memory-api, key: OTEL_EXPORTER_OTLP_ENDPOINT}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef: {name: memory-api, key: OTEL_EXPORTER_OTLP_HEADERS}
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
