apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: memory-api
      app.kubernetes.io/part-of: extend-memory-ai
    includeSelectors: true
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - hpa.yaml
  - pdb.yaml
  - purge-cronjob.yaml
images:
  - name: memory-api
    newName: ghcr.io/tomelin/extend-memory-ai
    newTag: latest
