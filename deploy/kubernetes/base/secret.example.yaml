apiVersion: v1
kind: Secret
metadata:
  name: memory-api
type: Opaque
stringData:
  MEMORY_DATABASE_URL: postgres://memory_app:CHANGE_ME@postgres:5432/extend_memory_for_ai?sslmode=require
  MEMORY_ADMIN_DATABASE_URL: postgres://memory_admin:CHANGE_ME@postgres:5432/extend_memory_for_ai?sslmode=require
  MEMORY_MIGRATOR_DATABASE_URL: postgres://memory_migrator:CHANGE_ME@postgres:5432/extend_memory_for_ai?sslmode=require
  OTEL_EXPORTER_OTLP_ENDPOINT: https://otlp-gateway-CHANGE_ME.grafana.net/otlp
  OTEL_EXPORTER_OTLP_HEADERS: Authorization=Basic%20CHANGE_ME
