apiVersion: batch/v1
kind: CronJob
metadata:
  name: memory-purge
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: purge
              image: memory-api
              command: ["/usr/local/bin/memory-admin", "purge", "--deleted-retention", "720h"]
              env:
                - name: MEMORY_ADMIN_DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: memory-api, key: MEMORY_ADMIN_DATABASE_URL}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
